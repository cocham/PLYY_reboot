// 1. 플러그인 (Plugins)
plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '3.3.2'
	id 'com.epages.restdocs-api-spec' version '0.19.2'
}

group = 'com.plyy'
version = '0.0.1-SNAPSHOT'
description = 'plyy reboot project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 2. 버전 관리 및 Snippets 경로 (ext)
ext {
	set('snippetsDir', file("build/generated-snippets"))
	queryDslVersion = "5.0.0"
	restdocsApiSpecVersion = "0.19.2"
}

// 3. 라이브러리 저장소 (Repositories)
repositories {
	mavenCentral()
}

// 4. Asciidoctor 설정 (REST Docs)
configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	asciidoctorExt
}

// 5. 의존성 (Dependencies)
dependencyManagement {
	imports {
		mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:3.1.1"
	}
}

dependencies {
	// Spring Boot Starters (Web, JPA, Redis, Security, etc.)
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	configurations {
		implementation.exclude group: 'io.lettuce', module: 'lettuce-core'
	}
	implementation 'redis.clients:jedis'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// Database (MySQL, Flyway, QueryDSL, P6Spy)
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.1'

	// JWT (Token)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// AWS S3 (File Storage)
//	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'

	// Developer Tools (Lombok, DevTools)
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'

	// Annotation Processors (QueryDSL)
	annotationProcessor "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

	// Test & Documentation (REST Docs, Swagger-Gen)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation "com.epages:restdocs-api-spec-mockmvc:${restdocsApiSpecVersion}"
	asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
}

// ===================================================================
// 6. 태스크 설정 (Tasks & Configurations)
// ===================================================================

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	configurations 'asciidoctorExt'
	dependsOn test

	doLast {
		delete file('src/main/resources/static/docs')
		copy {
			from "build/docs/asciidoc"
			into "src/main/resources/static/docs"
		}
	}
}

openapi3 {
	servers = [
			{ url = 'http://localhost:8080' }
	]
	title = 'PLYY API'
	description = 'TDD(Spring REST Docs) 기반으로 자동 생성된 API 명세서'
	version = '1.0.0'
	format = 'yaml'
}

def querydslDir = file("$buildDir/generated/querydsl")

sourceSets {
	main {
		java {
			srcDir querydslDir
		}
	}
}

tasks.register("generateQueryDSL", JavaCompile) {
	doFirst {
		delete querydslDir
	}
	source = sourceSets.main.java
	classpath = configurations.compileClasspath
	options.annotationProcessorPath = configurations.annotationProcessor
	destinationDir = querydslDir
}

tasks.named('bootJar') {
	dependsOn 'asciidoctor'
	dependsOn 'openapi3'

	from ("build/api-spec") {
		include "*.yaml"
		into "static/docs"
	}
}